<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Apidoo recette a déménagé</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="refresh" content="3;url=https://apidoo.github.io/apidoo-recette/"></head>
<body><p>La recette a déménagé : <a href="https://apidoo.github.io/apidoo-recette/">apidoo.github.io/apidoo-recette</a></p>
<script>
// Retire l'ancienne version gardée sur le téléphone, puis redirige.
(navigator.serviceWorker ? navigator.serviceWorker.getRegistration('./').then(r => r && r.scope.endsWith('/recette/') && r.unregister()) : Promise.resolve())
  .finally(() => location.replace('https://apidoo.github.io/apidoo-recette/'));
</script></body></html>
