# Évite la mise en pause des projets Supabase gratuits (après 7 jours sans activité).
name: Réveil Supabase

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Production
        run: |
          curl -fsS -X POST "https://xkucyqzlqfeyuomrtjbu.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_KiQ7LZ59QdgSEWe2LNAPfA_NZhK_Mad" \
            -H "Content-Type: application/json" -d '{}'
      - name: Recette
        run: |
          curl -fsS -X POST "https://zaaaiqyhxehvgowlgztx.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_uKL6RhBb3QuqXQcB5r_wrQ_fhPCCZty" \
            -H "Content-Type: application/json" -d '{}'
