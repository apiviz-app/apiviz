# Clés VAPID des rappels (v5.87), à la main, une fois par projet.
# Actions › Clés VAPID › Run workflow : cible « recette » ou « production ».
# Crée une paire de clés et la range directement dans Supabase › Edge Functions › Secrets (VAPID_PUBLIQUE,
# VAPID_PRIVEE, VAPID_SUJET). Les clés ne sont jamais affichées : ni dans le journal, ni dans le dépôt, ni dans une
# conversation. Si VAPID_PUBLIQUE existe déjà sur la cible, rien n'est fait : changer de clés couperait les rappels de
# tous les appareils déjà abonnés (cocher « Remplacer » seulement en connaissance de cause).
# Réglage : secret SUPABASE_ACCESS_TOKEN avec les droits « Edge Function Secrets » en lecture-écriture.
name: Clés VAPID

on:
  workflow_dispatch:
    inputs:
      cible:
        description: "Projet Supabase"
        type: choice
        options: [recette, production]
        default: recette
      remplacer:
        description: "Remplacer des clés existantes (coupe les rappels des appareils déjà abonnés)"
        type: boolean
        default: false

concurrency:
  group: cles-vapid-${{ inputs.cible }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Réglage présent ?
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Secret SUPABASE_ACCESS_TOKEN absent (docs/PROCESSUS.md § Fonctions serveur)."; exit 1
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: supabase/setup-cli@v2
        with:
          version: 3.4.0
      - name: Créer et ranger les clés
        env:
          CIBLE: ${{ inputs.cible }}
          REMPLACER: ${{ inputs.remplacer }}
        run: |
          set -euo pipefail
          if [ "$CIBLE" = production ]; then ref=xkucyqzlqfeyuomrtjbu; else ref=zaaaiqyhxehvgowlgztx; fi
          noms=$(supabase secrets list --project-ref "$ref" -o json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log((Array.isArray(j)?j:[]).map(x=>x.name).join(" "))})')
          case " $noms " in
            *" VAPID_PUBLIQUE "*)
              if [ "$REMPLACER" != true ]; then
                printf '### Clés VAPID : %s\n\nDéjà présentes : rien n'"'"'a été changé.\n' "$CIBLE" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi;;
          esac
          f=$(mktemp)
          npx --yes web-push@3.6.7 generate-vapid-keys --json | node -e '
            let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{
              const k=JSON.parse(s);
              console.log("::add-mask::"+k.privateKey);
              require("fs").writeFileSync(process.argv[1],
                "VAPID_PUBLIQUE="+k.publicKey+"\nVAPID_PRIVEE="+k.privateKey+"\nVAPID_SUJET=mailto:apiviz.app@gmail.com\n");
            });' "$f"
          supabase secrets set --project-ref "$ref" --env-file "$f" --yes > /dev/null
          rm -f "$f"
          printf '### Clés VAPID : %s\n\nClés créées et rangées dans Supabase (VAPID_PUBLIQUE, VAPID_PRIVEE, VAPID_SUJET).\n' "$CIBLE" >> "$GITHUB_STEP_SUMMARY"
