# Vérifications : à chaque pull request et à chaque arrivée sur main.
# Aucune vraie base n'est touchée : les tests utilisent une base simulée.
name: Vérifier

on:
  # Toutes les pull requests, documentation comprise : « verifier » et « Tests SQL » sont obligatoires pour fusionner
  # sur main (règle GitHub « main protégée ») ; une pull request sans vérification resterait bloquée.
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifier:
    # ubuntu-latest : le 11 nov. 2026 au soir, les tâches sur « ubuntu-24.04 » n'ont trouvé aucune machine.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tests unitaires (règles métier, sans navigateur)
        run: npm test
      - name: Assembler le site
        run: sh scripts/assembler-site.sh . . _site
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Installer Playwright
        run: pip install playwright
      - name: Tests
        env:
          SANS_SQL: "1"
        run: sh tests/lancer.sh _site/recette

  # Tests SQL (IT-04, AP-FEAT-008) : migrations, règles d'accès entre exploitations, rôles, fonctions.
  # Job séparé, sans navigateur : il tourne en parallèle et répond en moins d'une minute.
  sql:
    name: Tests SQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Migrations, règles d'accès et fonctions (Postgres en mémoire)
        run: sh tests/sql/lancer.sh
